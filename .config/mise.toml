min_version = "2024.11.3"

[env]
# Automatic virtualenv activation
_.python.venv = { path = ".venv", create = true }

[tools]
bun = "1"
jq = "latest"
python = "3"
uv = "latest"

# For Dotfiles/bin/dhall-to-toml-via-yq; drop along with Dhall. It needs
# kislyuk's jq-wrapping `yq` for `--toml-output`; the registry's bare `yq` is
# mikefarah's.
[tools."pipx:yq"]
version = "latest"

[tools."github:dhall-lang/dhall-haskell"]
version = "latest"
matching = "dhall-json"
